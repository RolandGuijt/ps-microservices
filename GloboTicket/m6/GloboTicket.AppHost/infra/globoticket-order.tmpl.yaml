api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--globoticket-mysql-order
        value: Server=globoticket-sql-mysql;Port=3306;User ID=root;Password={{ securedParameter "globoticket_sql_mysql_password" }};Database=globoticket-mysql-order
      - name: connectionstrings--transport
        value: amqp://{{ uriEncode (securedParameter "transportUserName" )}}:{{ uriEncode (securedParameter "transportPassword" )}}@transport:5672
      - name: globoticket-mysql-order-password
        value: '{{ securedParameter "globoticket_sql_mysql_password" }}'
      - name: transport-password
        value: '{{ securedParameter "transportPassword" }}'
      - name: transport-username
        value: '{{ securedParameter "transportUserName" }}'
  template:
    containers:
      - image: {{ .Image }}
        name: globoticket-order
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: GLOBOTICKET_IDENTITY_HTTP
            value: http://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_IDENTITY_HTTPS
            value: https://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_MYSQL_ORDER_DATABASENAME
            value: globoticket-mysql-order
          - name: GLOBOTICKET_MYSQL_ORDER_HOST
            value: globoticket-sql-mysql
          - name: GLOBOTICKET_MYSQL_ORDER_JDBCCONNECTIONSTRING
            value: jdbc:mysql://globoticket-sql-mysql:3306/globoticket-mysql-order
          - name: GLOBOTICKET_MYSQL_ORDER_PORT
            value: "3306"
          - name: GLOBOTICKET_MYSQL_ORDER_URI
            value: mysql://root:{{ uriEncode (securedParameter "globoticket_sql_mysql_password" )}}@globoticket-sql-mysql:3306/globoticket-mysql-order
          - name: GLOBOTICKET_MYSQL_ORDER_USERNAME
            value: root
          - name: GLOBOTICKET_SHOPPINGBASKET_HTTP
            value: http://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_SHOPPINGBASKET_HTTPS
            value: https://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: TRANSPORT_HOST
            value: transport
          - name: TRANSPORT_PORT
            value: "5672"
          - name: TRANSPORT_URI
            value: amqp://{{ uriEncode (securedParameter "transportUserName" )}}:{{ uriEncode (securedParameter "transportPassword" )}}@transport:5672
          - name: services__globoticket-identity__http__0
            value: http://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-identity__https__0
            value: https://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-shoppingbasket__http__0
            value: http://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-shoppingbasket__https__0
            value: https://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__globoticket-mysql-order
            secretRef: connectionstrings--globoticket-mysql-order
          - name: ConnectionStrings__transport
            secretRef: connectionstrings--transport
          - name: GLOBOTICKET_MYSQL_ORDER_PASSWORD
            secretRef: globoticket-mysql-order-password
          - name: TRANSPORT_PASSWORD
            secretRef: transport-password
          - name: TRANSPORT_USERNAME
            secretRef: transport-username
    scale:
      minReplicas: 1
tags:
  azd-service-name: globoticket-order
  aspire-resource-name: globoticket-order
