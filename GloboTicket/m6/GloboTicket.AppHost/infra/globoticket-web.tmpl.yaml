api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: true
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: false
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--keys-storage
        value: '{{ .Env.IDENTITY_STORAGE_BLOBENDPOINT }}'
  template:
    containers:
      - image: {{ .Image }}
        name: globoticket-web
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: GLOBOTICKET_EVENTCATALOG_HTTP
            value: http://globoticket-eventcatalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_EVENTCATALOG_HTTPS
            value: https://globoticket-eventcatalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_IDENTITY_HTTP
            value: http://globoticket-identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_IDENTITY_HTTPS
            value: https://globoticket-identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_ORDER_HTTP
            value: http://globoticket-order.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_ORDER_HTTPS
            value: https://globoticket-order.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_SHOPPINGBASKET_HTTP
            value: http://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_SHOPPINGBASKET_HTTPS
            value: https://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: KEYS_STORAGE_URI
            value: '{{ .Env.IDENTITY_STORAGE_BLOBENDPOINT }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: services__globoticket-eventcatalog__http__0
            value: http://globoticket-eventcatalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-eventcatalog__https__0
            value: https://globoticket-eventcatalog.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-identity__http__0
            value: http://globoticket-identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-identity__https__0
            value: https://globoticket-identity.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-order__http__0
            value: http://globoticket-order.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-order__https__0
            value: https://globoticket-order.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-shoppingbasket__http__0
            value: http://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-shoppingbasket__https__0
            value: https://globoticket-shoppingbasket.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__keys-storage
            secretRef: connectionstrings--keys-storage
    scale:
      minReplicas: 1
tags:
  azd-service-name: globoticket-web
  aspire-resource-name: globoticket-web
