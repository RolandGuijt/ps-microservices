api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--globoticket-postgres-eventcatalog
        value: Host=globoticket-sql-postgres;Port=5432;Username=postgres;Password={{ securedParameter "globoticket_sql_postgres_password" }};Database=globoticket-postgres-eventcatalog
      - name: globoticket-postgres-eventcatalog-password
        value: '{{ securedParameter "globoticket_sql_postgres_password" }}'
  template:
    containers:
      - image: {{ .Image }}
        name: globoticket-eventcatalog
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: GLOBOTICKET_IDENTITY_HTTP
            value: http://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_IDENTITY_HTTPS
            value: https://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_DATABASENAME
            value: globoticket-postgres-eventcatalog
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_HOST
            value: globoticket-sql-postgres
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_JDBCCONNECTIONSTRING
            value: jdbc:postgresql://globoticket-sql-postgres:5432/globoticket-postgres-eventcatalog
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_PORT
            value: "5432"
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_URI
            value: postgresql://postgres:{{ uriEncode (securedParameter "globoticket_sql_postgres_password" )}}@globoticket-sql-postgres:5432/globoticket-postgres-eventcatalog
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_USERNAME
            value: postgres
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EVENT_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_EMIT_EXCEPTION_LOG_ATTRIBUTES
            value: "true"
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: services__globoticket-identity__http__0
            value: http://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: services__globoticket-identity__https__0
            value: https://globoticket-identity.internal.{{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_DEFAULT_DOMAIN }}
          - name: ConnectionStrings__globoticket-postgres-eventcatalog
            secretRef: connectionstrings--globoticket-postgres-eventcatalog
          - name: GLOBOTICKET_POSTGRES_EVENTCATALOG_PASSWORD
            secretRef: globoticket-postgres-eventcatalog-password
    scale:
      minReplicas: 1
tags:
  azd-service-name: globoticket-eventcatalog
  aspire-resource-name: globoticket-eventcatalog
